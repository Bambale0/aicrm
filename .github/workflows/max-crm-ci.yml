name: MAX CRM CI

on:
  push:
    branches:
      - fix/max-crm-admin-complete
  pull_request:
    branches:
      - "1.3"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/max-crm-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: sqlite+pysqlite:///./ci.db
      REDIS_URL: redis://127.0.0.1:6379/0
      TELEGRAM_API_BASE_URL: https://api.telegram.org
      MAX_API_BASE_URL: https://platform-api2.max.ru
      MAX_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PUBLIC_BASE_URL: https://crm.example.test
      AI_API_BASE_URL: https://api.example.test/v1
      AUTH_REQUIRED: "true"
      PUBLIC_REGISTRATION_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e "./backend[dev]"

      - name: Compile backend
        run: python -m compileall -q backend/src/aicrm

      - name: Backend tests
        run: pytest -q backend/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build
